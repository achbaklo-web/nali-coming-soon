<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaLi Spa &amp; Salon | Coming Soon</title>
  <meta name="description" content="NaLi Spa &amp; Salon — Luxury sanctuary of wellness, curative hydrotherapy, and holistic treatments in Freetown, Sierra Leone. Our website is on the way.">
  <link rel="icon" type="image/png" href="assets/logo/nali-logo-official.png">

  <!-- Native Font Declarations (1:1 Lunacy AST Bundled) -->
  <style>
    @font-face {
      font-family: 'Zaslia';
      src: local('Zaslia'),
           url('assets/fonts/Zaslia.otf') format('opentype'),
           url('/assets/fonts/Zaslia.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Rollandio';
      src: local('Rollandio'),
           url('assets/nali/fonts/Rollandio.ttf') format('truetype'),
           url('/assets/nali/fonts/Rollandio.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MADESAONARA';
      src: local('MADESAONARA'),
           url('assets/nali/fonts/MADESAONARA.otf') format('opentype'),
           url('/assets/nali/fonts/MADESAONARA.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #141A12;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'CormorantGaramond-Regular', 'Cormorant Garamond', Georgia, serif;
    }

    /* Fixed Aspect Ratio Scaled Frame Container (1440 x 703) */
    .artboard-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #141A12;
      overflow: hidden;
    }

    .artboard-canvas {
      position: relative;
      width: 100%;
      max-width: 1440px;
      aspect-ratio: 1440 / 703;
      max-height: 100vh;
      overflow: hidden;
      background-color: #141A12;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Full-height viewport fallback for smaller screens */
    @media (max-aspect-ratio: 1440/703) {
      .artboard-canvas {
        width: 100vw;
        height: auto;
        aspect-ratio: 1440 / 703;
      }
    }

    /* Background Image: Exactly as positioned in Lunacy layer jkQKaQE0XkmdqiA9DbqRtA */
    .sanctuary-bg-layer {
      position: absolute;
      left: 0;
      top: -52.20%;
      width: 100%;
      height: 194.57%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      z-index: 1;
      display: block;
    }

    /* Interactive Overlay Link to Official Website */
    .canvas-overlay-link {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: block;
      text-decoration: none;
      cursor: pointer;
    }

    /* Coming Soon Content Composition: Exactly matching Reference 1 */
    .coming-soon-center-block {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 950px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .canvas-overlay-link:hover .coming-soon-center-block {
      transform: translate(-50%, -50%) scale(1.02);
    }

    /* 1. Large Luxury Headline: COMING SOON */
    .coming-soon-headline {
      font-family: 'Cormorant Garamond', 'Zaslia', Georgia, serif;
      font-size: clamp(34px, 5.2vw, 68px);
      font-weight: 300;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: #FFFFFF;
      text-indent: 0.24em; /* offset trailing letter-spacing for true center */
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 1px 4px rgba(0, 0, 0, 0.9);
      margin-bottom: clamp(14px, 2.2vw, 24px);
    }

    /* 2. Delicate Golden Botanical Leaf Divider */
    .leaf-divider-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 480px;
      margin-bottom: clamp(16px, 2.4vw, 26px);
    }

    .leaf-line {
      flex: 1;
      height: 1px;
      background: #C2A26F;
      opacity: 0.85;
    }

    .leaf-line.line-left {
      background: linear-gradient(90deg, rgba(194, 162, 111, 0) 0%, rgba(194, 162, 111, 0.9) 100%);
    }

    .leaf-line.line-right {
      background: linear-gradient(90deg, rgba(194, 162, 111, 0.9) 0%, rgba(194, 162, 111, 0) 100%);
    }

    .leaf-emblem {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 22px;
      transform: rotate(-25deg);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    .leaf-emblem svg {
      width: 100%;
      height: 100%;
      stroke: #C2A26F;
      fill: none;
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 3. Refined Sans-Serif Subtitle: OUR NEW WEBSITE IS ON ITS WAY */
    .coming-soon-subheading {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(13px, 1.6vw, 21px);
      font-weight: 300;
      line-height: 1.7;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: #D9CEBF;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- 1:1 Lunacy Artboard Canvas Viewport -->
  <div class="artboard-stage">
    <div class="artboard-canvas">
      
      <!-- Background Image Layer (Lunacy Layer: 1000931111.jpg / 9ecf1b3d...png) -->
      <img src="assets/img/coming-soon-bg.png" 
           alt="NaLi Spa &amp; Salon Sanctuary Reception" 
           class="sanctuary-bg-layer" />

      <!-- Clickable Link leading to Full Official Website -->
      <a href="/index.html" class="canvas-overlay-link" title="Explore NaLi Spa &amp; Salon">
        <!-- Reference 1 Composition: COMING SOON + Leaf Divider + Subheading -->
        <div class="coming-soon-center-block">
          <h1 class="coming-soon-headline">COMING SOON</h1>
          
          <div class="leaf-divider-wrapper" aria-hidden="true">
            <span class="leaf-line line-left"></span>
            <div class="leaf-emblem">
              <svg viewBox="0 0 32 20">
                <path d="M 2,10 C 9,2 23,2 30,10 C 23,18 9,18 2,10 Z" />
                <line x1="2" y1="10" x2="30" y2="10" />
                <path d="M 11,6.5 L 15,10 M 19,5.5 L 23,10 M 11,13.5 L 15,10 M 19,14.5 L 23,10" />
              </svg>
            </div>
            <span class="leaf-line line-right"></span>
          </div>

          <p class="coming-soon-subheading">
            <span>OUR NEW WEBSITE IS</span>
            <span>ON ITS WAY</span>
          </p>
        </div>
      </a>

    </div>
  </div>

  <!-- Live Hot-Reload Listener for Lunacy Saves -->
  

</body>
</html>
